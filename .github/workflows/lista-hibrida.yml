name: Lista Híbrida — Verificação
on:
  pull_request:
    paths:
      - "lista_hibrida/**"
      - ".github/workflows/lista-hibrida.yml"
  push:
    paths:
      - "lista_hibrida/**"
      - ".github/workflows/lista-hibrida.yml"
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: python -m pip install -r lista_hibrida/requirements.txt
      - name: Compile Python sources
        run: python -m py_compile lista_hibrida/app.py lista_hibrida/estrutura.py lista_hibrida/tema.py
      - name: Run unit tests
        working-directory: lista_hibrida
        run: python -m unittest discover -s tests -v
      - name: Smoke-test Streamlit server
        shell: bash
        run: |
          streamlit run lista_hibrida/app.py --server.headless true --server.port 8501 > /tmp/streamlit.log 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 25); do
            if curl --fail --silent http://localhost:8501/_stcore/health | grep -q ok; then
              echo "Streamlit health endpoint OK"
              exit 0
            fi
            sleep 1
          done
          cat /tmp/streamlit.log
          exit 1
